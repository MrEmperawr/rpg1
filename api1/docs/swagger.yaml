basePath: /
definitions:
  game.CharacterAttribute:
    properties:
      attribute:
        $ref: '#/definitions/srd.Attribute'
      attribute_id:
        type: string
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      updated_at:
        type: string
      value:
        type: integer
    type: object
  game.CharacterDerivedStats:
    properties:
      carrying_capacity:
        type: integer
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      dodge:
        type: integer
      health:
        type: integer
      id:
        type: string
      initiative_bonus:
        type: integer
      mental_resistance:
        type: integer
      perception:
        type: integer
      physical_resistance:
        type: integer
      tolerance_max:
        type: integer
      updated_at:
        type: string
      willpower_bonus:
        type: integer
      willpower_points:
        type: integer
    type: object
  game.CharacterEquipment:
    properties:
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      equipment:
        $ref: '#/definitions/srd.Equipment'
      equipment_id:
        type: string
      id:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  game.CharacterPersonalEquipment:
    properties:
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      personal_equipment:
        $ref: '#/definitions/game.PersonalEquipment'
      personal_equipment_id:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  game.CharacterQuality:
    properties:
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      quality:
        $ref: '#/definitions/srd.Quality'
      quality_id:
        type: string
      rating:
        type: integer
      updated_at:
        type: string
    type: object
  game.CharacterSkill:
    properties:
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      skill:
        $ref: '#/definitions/srd.Skill'
      skill_id:
        type: string
      updated_at:
        type: string
      value:
        type: integer
    type: object
  game.CharacterSkillSpecialty:
    properties:
      character:
        allOf:
        - $ref: '#/definitions/models.Character'
        description: Relationships
      character_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      skill_specialty:
        $ref: '#/definitions/srd.SkillSpecialty'
      skill_specialty_id:
        type: string
    type: object
  game.PersonalEquipment:
    properties:
      capacity:
        description: For items with capacity (programs, IC, etc.)
        type: integer
      category:
        description: Carry, Light, Tools, Vision, Communication, Electronics, Clothing,
          Living, Restraint, Magical aid
        type: string
      cost:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      era:
        description: Medieval, Industrial, Cyber
        type: string
      id:
        type: string
      name:
        type: string
      rarity:
        description: 0=Civilian, 1-3=Restricted, 4-5=Military
        type: integer
      rating:
        description: For items with ratings
        type: integer
      size:
        type: integer
      special:
        description: Special properties and effects
        type: string
      subcategory:
        description: Medieval, Industrial, Cyber
        type: string
      type:
        description: Specific type within category
        type: string
      updatedAt:
        type: string
      weight:
        type: number
    type: object
  handlers.AddSkillSpecialtyRequest:
    properties:
      skill_specialty_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    type: object
  handlers.AddSkillSpecialtyResponse:
    properties:
      message:
        example: Character skill specialty added successfully
        type: string
    type: object
  handlers.ChangePasswordRequest:
    properties:
      current_password:
        example: oldpassword123
        type: string
      new_password:
        example: newpassword123
        minLength: 6
        type: string
    required:
    - current_password
    - new_password
    type: object
  handlers.ChangePasswordResponse:
    properties:
      message:
        example: Password changed successfully
        type: string
    type: object
  handlers.CharacterSearchResponse:
    properties:
      characters:
        items:
          $ref: '#/definitions/models.Character'
        type: array
      count:
        example: 5
        type: integer
      query:
        example: fighter
        type: string
    type: object
  handlers.CreateUserResponse:
    properties:
      message:
        example: User created successfully
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.DeleteResponse:
    properties:
      message:
        example: Character deleted successfully
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        example: Error message
        type: string
    type: object
  handlers.GetCurrentUserResponse:
    properties:
      user: {}
    type: object
  handlers.GetUserResponse:
    properties:
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      message:
        example: Login successful
        type: string
      session: {}
      user: {}
    type: object
  handlers.LogoutResponse:
    properties:
      message:
        example: Logout successful
        type: string
    type: object
  handlers.RefreshTokenRequest:
    properties:
      refresh_token:
        example: refresh_token_here
        type: string
    required:
    - refresh_token
    type: object
  handlers.RefreshTokenResponse:
    properties:
      message:
        example: Token refreshed successfully
        type: string
      session: {}
      user: {}
    type: object
  handlers.RegisterRequest:
    properties:
      display_name:
        example: johndoe
        type: string
      email:
        example: user@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: password123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  handlers.RegisterResponse:
    properties:
      message:
        example: User registered successfully
        type: string
      session: {}
      user: {}
    type: object
  handlers.SRDCategoriesResponse:
    properties:
      categories:
        items: {}
        type: array
      count:
        example: 8
        type: integer
    type: object
  handlers.SRDContentByTitleResponse:
    properties:
      content: {}
    type: object
  handlers.SRDContentResponse:
    properties:
      content:
        items: {}
        type: array
      count:
        example: 15
        type: integer
    type: object
  handlers.SRDEntriesByCategoryResponse:
    properties:
      category:
        example: spells
        type: string
      count:
        example: 5
        type: integer
      entries:
        items: {}
        type: array
    type: object
  handlers.SRDEntriesResponse:
    properties:
      count:
        example: 10
        type: integer
      entries:
        items: {}
        type: array
    type: object
  handlers.SRDEntryResponse:
    properties:
      entry: {}
    type: object
  handlers.SRDSearchResponse:
    properties:
      count:
        example: 3
        type: integer
      entries:
        items: {}
        type: array
      query:
        example: fireball
        type: string
    type: object
  handlers.UpdateQuantityResponse:
    properties:
      message:
        example: Quantity updated successfully
        type: string
    type: object
  handlers.UserPreferencesResponse:
    properties:
      preferences:
        additionalProperties: true
        type: object
    type: object
  handlers.UserProfileResponse:
    properties:
      profile:
        $ref: '#/definitions/models.User'
    type: object
  handlers.UserSearchResponse:
    properties:
      count:
        example: 5
        type: integer
      query:
        example: john
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  handlers.UserStatsResponse:
    properties:
      stats:
        additionalProperties: true
        type: object
    type: object
  models.Campaign:
    properties:
      created_at:
        type: string
      description:
        type: string
      era:
        description: Medieval, Industrial, Cyber, etc.
        type: string
      gm_user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      gm_user_id:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  models.Character:
    properties:
      campaign:
        $ref: '#/definitions/models.Campaign'
      campaignID:
        description: One campaign per character
        type: string
      concept:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      speciesID:
        type: string
      starting_points_option:
        type: string
      type:
        description: PC, NPC
        type: string
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      userID:
        type: string
      vice:
        type: string
      virtue:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      updated_at:
        type: string
    type: object
  srd.Attribute:
    properties:
      category:
        description: Physical, Mental, Social
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        description: Brawn, Agility, Logic, etc.
        type: string
      updated_at:
        type: string
    type: object
  srd.Equipment:
    properties:
      category:
        description: Weapon, Armor, Gear, etc.
        type: string
      cost:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      properties:
        description: Flexible storage for special properties
        type: string
      rarity:
        description: 1-10
        type: integer
      size:
        type: integer
      updated_at:
        type: string
    type: object
  srd.Language:
    properties:
      code:
        description: en, sv, es, fr, de, pl, zh, ja
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        description: English, Swedish, Spanish, etc.
        type: string
      updated_at:
        type: string
    type: object
  srd.Quality:
    properties:
      cost_per_rank:
        description: Quality points or XP cost
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      max_rating:
        type: integer
      min_rating:
        type: integer
      name:
        type: string
      type:
        description: '"positive" or "negative"'
        type: string
      updated_at:
        type: string
    type: object
  srd.SRDContent:
    properties:
      content:
        type: string
      created_at:
        type: string
      entry:
        allOf:
        - $ref: '#/definitions/srd.SRDEntry'
        description: Relationships
      entry_id:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      language:
        $ref: '#/definitions/srd.Language'
      language_id:
        type: string
      updated_at:
        type: string
    type: object
  srd.SRDEntry:
    properties:
      category:
        description: Attributes, Skills, Qualities, etc.
        type: string
      content:
        items:
          $ref: '#/definitions/srd.SRDContent'
        type: array
      created_at:
        type: string
      created_by:
        type: string
      creator:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      id:
        type: string
      is_active:
        type: boolean
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  srd.Skill:
    properties:
      category:
        description: Combat, Social, Technical, etc.
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_magical:
        type: boolean
      name:
        description: Athletics, Melee, etc.
        type: string
      updated_at:
        type: string
    type: object
  srd.SkillSpecialty:
    properties:
      bonus:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      skill:
        allOf:
        - $ref: '#/definitions/srd.Skill'
        description: Relationships
      skill_id:
        type: string
      type:
        description: '"typical" or "exotic"'
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A comprehensive RPG game API with authentication, characters, and SRD
    content.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: RPG API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return session token
      parameters:
      - description: Login data
        in: body
        name: login_data
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: User login
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate session token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: Get the current authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GetCurrentUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the access token using a refresh token
      parameters:
      - description: Refresh token
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /api/characters:
    get:
      consumes:
      - application/json
      description: Retrieve all characters belonging to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Character'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user's characters
      tags:
      - characters
    post:
      consumes:
      - application/json
      description: Create a new character for the authenticated user
      parameters:
      - description: Character data
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/models.Character'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Character'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new character
      tags:
      - characters
  /api/characters/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a character by its ID
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete character
      tags:
      - characters
    get:
      consumes:
      - application/json
      description: Retrieve a character by its unique identifier
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Character'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character by ID
      tags:
      - characters
    put:
      consumes:
      - application/json
      description: Update an existing character's information
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Updated character data
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/models.Character'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Character'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update character
      tags:
      - characters
  /api/characters/{id}/attributes:
    get:
      consumes:
      - application/json
      description: Retrieve all attributes for a specific character
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/game.CharacterAttribute'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character attributes
      tags:
      - characters
    post:
      consumes:
      - application/json
      description: Set or update a character's attribute value
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Attribute data
        in: body
        name: attribute
        required: true
        schema:
          $ref: '#/definitions/game.CharacterAttribute'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/game.CharacterAttribute'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set character attribute
      tags:
      - characters
  /api/characters/{id}/attributes/{attributeId}:
    delete:
      consumes:
      - application/json
      description: Delete a character's attribute
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Attribute ID
        format: uuid
        in: path
        name: attributeId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete character attribute
      tags:
      - characters
  /api/characters/{id}/derived-stats:
    get:
      consumes:
      - application/json
      description: Retrieve derived statistics for a specific character
      parameters:
      - description: Character ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
